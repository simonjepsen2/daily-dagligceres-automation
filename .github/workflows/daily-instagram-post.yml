name: Daily DagligCeres Instagram Post

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install curl
      run: sudo apt-get update && sudo apt-get install -y curl jq
        
    - name: Post DagligCeres to Instagram
      env:
        COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      run: |
        #!/bin/bash
        set -e
        
        echo "🚀 Starting daily Instagram post..."
        
        # Function to call Composio API
        call_composio() {
            local tool_slug="$1"
            local arguments="$2"
            
            echo "🔧 Executing $tool_slug"
            
            local response=$(curl -s -X POST \
                "https://backend.composio.dev/api/v1/actions/multi-execute" \
                -H "X-API-Key: $COMPOSIO_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{
                    \"tools\": [{
                        \"tool_slug\": \"$tool_slug\",
                        \"arguments\": $arguments
                    }],
                    \"sync_response_to_workbench\": false
                }")
            
            echo "📡 Response received"
            
            # Check if successful
            local success_count=$(echo "$response" | jq -r '.data.success_count // 0')
            if [ "$success_count" -eq 1 ]; then
                echo "$response" | jq -r '.data.results[0].response.data'
            else
                echo "❌ Error: $response"
                exit 1
            fi
        }
        
        # Step 1: Get Instagram account info
        echo "📊 Getting Instagram account info..."
        user_info=$(call_composio "INSTAGRAM_GET_USER_INFO" '{"ig_user_id": "me"}')
        
        media_count=$(echo "$user_info" | jq -r '.media_count // 0')
        day_number=$((media_count + 1))
        ig_user_id=$(echo "$user_info" | jq -r '.id')
        username=$(echo "$user_info" | jq -r '.username')
        
        echo "📅 Today will be: Dag $day_number"
        echo "👤 Account: @$username"
        
        # Step 2: Download image from Google Drive
        echo "⬇️ Downloading DagligCeres from Google Drive..."
        download_result=$(call_composio "GOOGLEDRIVE_DOWNLOAD_FILE" '{"fileId": "1FpB9exKU8IuOeUqQjgdg56fNFZy-Ty4E"}')
        
        image_url=$(echo "$download_result" | jq -r '.downloaded_file_content.s3url')
        echo "✅ Image downloaded successfully"
        
        # Step 3: Create Instagram media container
        echo "📷 Creating Instagram media container..."
        container_result=$(call_composio "INSTAGRAM_POST_IG_USER_MEDIA" "{
            \"ig_user_id\": \"$ig_user_id\",
            \"image_url\": \"$image_url\",
            \"caption\": \"Dag $day_number\"
        }")
        
        container_id=$(echo "$container_result" | jq -r '.id')
        echo "✅ Container created: $container_id"
        
        # Step 4: Publish to Instagram
        echo "🚀 Publishing to Instagram..."
        publish_result=$(call_composio "INSTAGRAM_POST_IG_USER_MEDIA_PUBLISH" "{
            \"ig_user_id\": \"$ig_user_id\",
            \"creation_id\": \"$container_id\",
            \"max_wait_seconds\": 120
        }")
        
        media_id=$(echo "$publish_result" | jq -r '.id')
        
        echo "🎉 SUCCESS! Posted 'Dag $day_number' to Instagram!"
        echo "📱 Media ID: $media_id"
