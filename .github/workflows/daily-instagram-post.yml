name: Daily DagligCeres Instagram Post

on:
  workflow_dispatch:

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Composio
        run: |
          python -m pip install --upgrade pip
          pip install "composio==0.18.0"

      - name: Run Instagram poster
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: python post_instagram.py
