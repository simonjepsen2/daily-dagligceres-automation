```yaml
name: Daily DagligCeres Instagram Post

on:
  schedule:
    # Run every hour. Python checks Copenhagen time below.
    - cron: "0 * * * *"

  # Allows you to test/run it manually from GitHub.
  workflow_dispatch:

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Composio
        run: |
          python -m pip install --upgrade pip
          pip install composio-core

      - name: Post DagligCeres to Instagram
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          python <<'PY'
          import os
          import sys
          import traceback
          from datetime import datetime
          from zoneinfo import ZoneInfo

          # --------------------------------------------------
          # CHECK COPENHAGEN TIME
          # --------------------------------------------------

          now = datetime.now(ZoneInfo("Europe/Copenhagen"))

          print(
              f"🇩🇰 Copenhagen time: "
              f"{now.strftime('%Y-%m-%d %H:%M:%S %Z')}"
          )

          # Only continue around 12:00 Danish time.
          if now.hour != 12:
              print("⏭️ Not 12:00 in Denmark. Skipping.")
              sys.exit(0)

          print("🕛 It is 12:00 Danish time.")
          print("🚀 Starting DagligCeres Instagram post...")

          # --------------------------------------------------
          # CHECK API KEY
          # --------------------------------------------------

          api_key = os.environ.get("COMPOSIO_API_KEY")

          if not api_key:
              print("❌ COMPOSIO_API_KEY is missing.")
              sys.exit(1)

          # --------------------------------------------------
          # COMPOSIO
          # --------------------------------------------------

          from composio import Composio, App

          composio = Composio(api_key=api_key)

          try:

              # ------------------------------------------------
              # INSTAGRAM TOOLS
              # ------------------------------------------------

              print("📱 Loading Instagram tools...")

              instagram_tools = composio.get_tools(
                  apps=[App.INSTAGRAM]
              )

              print("Available Instagram tools:")

              for tool in instagram_tools:
                  print(f"  - {tool.name}")

              # ------------------------------------------------
              # GET INSTAGRAM ACCOUNT
              # ------------------------------------------------

              print("📊 Getting Instagram account information...")

              user_info_tool = next(
                  tool
                  for tool in instagram_tools
                  if tool.name == "INSTAGRAM_GET_USER_INFO"
              )

              user_info_result = user_info_tool.execute({
                  "ig_user_id": "me"
              })

              print(f"Instagram account response: {user_info_result}")

              ig_user_id = user_info_result["id"]

              username = user_info_result.get(
                  "username",
                  "Unknown"
              )

              media_count = user_info_result.get(
                  "media_count",
                  0
              )

              day_number = media_count + 1

              print(f"👤 Account: @{username}")
              print(f"📅 Posting: Dag {day_number}")

              # ------------------------------------------------
              # GOOGLE DRIVE
              # ------------------------------------------------

              print("☁️ Loading Google Drive tools...")

              drive_tools = composio.get_tools(
                  apps=[App.GOOGLEDRIVE]
              )

              print("Available Google Drive tools:")

              for tool in drive_tools:
                  print(f"  - {tool.name}")

              download_tool = next(
                  tool
                  for tool in drive_tools
                  if tool.name == "GOOGLEDRIVE_DOWNLOAD_FILE"
              )

              print("⬇️ Downloading image from Google Drive...")

              download_result = download_tool.execute({
                  "fileId": "1FpB9exKU8IuOeUqQjgdg56fNFZy-Ty4E"
              })

              print("Google Drive response received.")

              image_url = (
                  download_result[
                      "downloaded_file_content"
                  ]["s3url"]
              )

              if not image_url:
                  raise RuntimeError(
                      "Google Drive did not return an image URL."
                  )

              print("✅ Image downloaded.")

              # ------------------------------------------------
              # CREATE INSTAGRAM CONTAINER
              # ------------------------------------------------

              print("📷 Creating Instagram media container...")

              create_media_tool = next(
                  tool
                  for tool in instagram_tools
                  if tool.name == "INSTAGRAM_POST_IG_USER_MEDIA"
              )

              container_result = create_media_tool.execute({
                  "ig_user_id": ig_user_id,
                  "image_url": image_url,
                  "caption": f"Dag {day_number}"
              })

              print(
                  f"Container response: {container_result}"
              )

              container_id = container_result["id"]

              print(
                  f"✅ Container created: {container_id}"
              )

              # ------------------------------------------------
              # PUBLISH TO INSTAGRAM
              # ------------------------------------------------

              print("🚀 Publishing to Instagram...")

              publish_tool = next(
                  tool
                  for tool in instagram_tools
                  if tool.name ==
                  "INSTAGRAM_POST_IG_USER_MEDIA_PUBLISH"
              )

              publish_result = publish_tool.execute({
                  "ig_user_id": ig_user_id,
                  "creation_id": container_id,
                  "max_wait_seconds": 120
              })

              print(
                  f"Publish response: {publish_result}"
              )

              media_id = publish_result.get("id")

              print("")
              print("🎉 ===============================")
              print("🎉 SUCCESS!")
              print(f"🎉 Posted Dag {day_number}")
              print(f"🎉 Instagram: @{username}")
              print(f"🎉 Media ID: {media_id}")
              print("🎉 ===============================")

          except Exception as e:

              print("")
              print("❌ ===============================")
              print("❌ INSTAGRAM POST FAILED")
              print("❌ ===============================")
              print(f"❌ Error: {e}")
              print("")

              traceback.print_exc()

              sys.exit(1)
          PY
```
