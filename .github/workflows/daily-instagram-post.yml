name: Daily DagligCeres Instagram Post

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Composio
        run: |
          python -m pip install --upgrade pip
          pip install "composio==0.18.0"

      - name: Run Instagram poster
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: python post_instagram.py
